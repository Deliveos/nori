name: AUR package

# Builds dist/arch/nori-git/PKGBUILD in an Arch Linux container, from the commit under test
# instead of main, and checks the result.
on:
  pull_request:
    paths:
      - 'dist/arch/**'
      - '.github/workflows/aur.yml'
      # What package() installs, the --locked/--frozen build, and the CLI
      # definition. ci.yml covers the rest of the code; its nix job also
      # generates the completions.
      - 'resources/**'
      - 'README.md'
      - 'Cargo.toml'
      - '*/Cargo.toml'
      - 'Cargo.lock'
      - 'src/cli.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nori-git:
    name: nori-git PKGBUILD
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120

    steps:
      - name: Install git and namcap
        run: pacman -Syu --noconfirm --needed git namcap

      - uses: actions/checkout@v6
        with:
          # pkgver() counts the commits.
          fetch-depth: 0
          show-progress: false
          # The build runs code from the pull request with sudo.
          persist-credentials: false

      # makepkg refuses to run as root.
      - name: Create the build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Check that .SRCINFO matches the PKGBUILD
        working-directory: dist/arch/nori-git
        run: sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: Build the package from this commit
        run: |
          build=/tmp/nori-git
          mkdir "$build"
          cp dist/arch/nori-git/PKGBUILD "$build/"
          commit=$(sudo -u builder git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          sed -i "s|^source=.*|source=(\"\$_pkgname::git+file://$GITHUB_WORKSPACE#commit=$commit\")|" "$build/PKGBUILD"
          grep '^source=' "$build/PKGBUILD"
          chown -R builder: "$build"
          cd "$build"
          sudo -u builder makepkg --syncdeps --noconfirm

          # makepkg only warns when the package refers to $srcdir; fail instead.
          status=0
          # -r, not -R: don't follow symlinks out of the package.
          grep -arlF "$build/src" "$build/pkg" || status=$?
          case $status in
            0) echo 'The files above refer to the build directory'; exit 1 ;;
            1) ;;
            *) exit "$status" ;;
          esac

      - name: Run namcap
        shell: bash
        run: |
          namcap /tmp/nori-git/nori-git-*.pkg.tar.zst | tee namcap.log
          # namcap exits with status 0 even when it reports errors.
          if grep -q ' E: ' namcap.log; then
            echo 'namcap reported errors'
            exit 1
          fi

      - name: Install the package and check it
        run: |
          pacman -U --noconfirm /tmp/nori-git/nori-git-*.pkg.tar.zst
          pacman -Ql nori-git
          nori --version

          # Panics must show file and line without a debug package (docs/wiki/Packaging-niri.md).
          if nori panic > panic.log 2>&1; then
            echo 'nori panic exited with status 0'
            exit 1
          fi
          cat panic.log
          # The backtrace frame of cause_panic must have a file and line. The
          # panic message alone would show one even without line tables.
          grep -A1 -E '[0-9]+: (.*::)?cause_panic$' panic.log |
            grep -qE '^ +at /nori/src/.+\.rs:[0-9]+:[0-9]+$'
