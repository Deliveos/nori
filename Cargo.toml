[workspace]
members = [
    "niri-config",
    "niri-ipc",
    "niri-visual-tests",
]

[workspace.package]
version = "26.4.0"
description = "A scrollable-tiling Wayland compositor"
authors = ["Ivan Molodetskikh <yalterz@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/Deliveos/nori"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.13"
clap = { version = "4.6.6", features = ["derive"] }
insta = "1.48.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.5", default-features = false }

[workspace.dependencies.smithay]
# version = "0.4.1"
# Smithay 8a27023 plus the xdg_positioner fixes for #90 and #104, the negative Size fixes for #128,
# upstream's subtract_rects_many_in_place fix (2923f22) for #281, the virtual keyboard keymap fix
# for #183, the start_drag client check for #153, and the set of surfaces for #154, from the fork's
# long-lived `nori` branch. Switch back to Smithay/smithay once the fixes are upstream (#105).
git = "https://github.com/Deliveos/smithay.git"
rev = "0a77f9dd06660f7b709c4913152765f2b41009af"
default-features = false

[workspace.dependencies.smithay-drm-extras]
# version = "0.1.0"
git = "https://github.com/Deliveos/smithay.git"
rev = "0a77f9dd06660f7b709c4913152765f2b41009af"
# path = "../smithay/smithay-drm-extras"

[package]
name = "niri"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

readme = "README.md"
keywords = ["wayland", "compositor", "tiling", "smithay", "wm"]

[[bin]]
name = "nori"
path = "src/main.rs"

[dependencies]
accesskit = { version = "0.25", optional = true }
accesskit_unix = { version = "0.23", optional = true }
anyhow.workspace = true
arrayvec = "0.7.8"
async-channel = "2.5.0"
async-io = { version = "2.6.0", optional = true }
atomic = "0.6.1"
bitflags.workspace = true
bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = { version = "0.14.5", features = ["executor", "futures-io", "signals"] }
clap = { workspace = true, features = ["string"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
directories = "6.0.0"
drm-ffi = "0.9.1"
fastrand = "2.5.0"
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
git-version = "0.3.9"
glam = "0.33"
input = { version = "0.10.0", features = ["libinput_1_21"] }
keyframe = { version = "1.1.1", default-features = false }
libc = "0.2.189"
libdisplay-info = "0.3.0"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_debug"] }
niri-config = { version = "26.4.0", path = "niri-config" }
niri-ipc = { version = "26.4.0", path = "niri-ipc", features = ["clap"] }
ordered-float = "5"
pango = { version = "0.21.5", features = ["v1_44"] }
pangocairo = "0.21.5"
pipewire = { version = "0.10", optional = true, features = ["v0_3_33"] }
png = "0.18.1"
portable-atomic = "1"
profiling = "1.0.18"
sd-notify = "0.5.0"
serde.workspace = true
serde_json.workspace = true
smithay-drm-extras.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tracy-client.workspace = true
wayland-backend = "0.3"
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"
xcursor = "0.3.11"
zbus = { version = "5", optional = true }

[dependencies.smithay]
workspace = true
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "use_system_lib",
    "wayland_frontend",
]

[dev-dependencies]
approx = "0.5.1"
calloop-wayland-source = "0.4.1"
insta.workspace = true
proptest = "1.11.0"
proptest-derive = { version = "0.8.0", features = ["boxed_union"] }
rayon = "1.12.0"
wayland-client = "0.31.15"
# For peer-to-peer D-Bus connections in tests.
zbus = { version = "5", features = ["p2p"] }
xshell = "0.2.7"

[build-dependencies]
pkg-config = "0.3"

[features]
default = ["dbus", "systemd", "xdp-gnome-screencast"]
# Enables D-Bus support (serve various freedesktop and GNOME interfaces, accessibility tree, power button handling).
dbus = ["dep:zbus", "dep:async-io", "dep:accesskit", "dep:accesskit_unix"]
# Enables systemd integration (global environment, apps in transient scopes).
systemd = ["dbus"]
# Enables screencasting support through xdg-desktop-portal-gnome.
xdp-gnome-screencast = ["dbus", "pipewire"]
# Enables the Tracy profiler instrumentation.
profile-with-tracy = ["profiling/profile-with-tracy", "tracy-client/default", "smithay/tracy_gpu_profiling"]
# Enables the on-demand Tracy profiler instrumentation.
profile-with-tracy-ondemand = ["profile-with-tracy", "tracy-client/ondemand", "tracy-client/manual-lifetime"]
# Enables Tracy allocation profiling.
profile-with-tracy-allocations = ["profile-with-tracy"]
# Enables dinit integration (global environment).
dinit = []

[lints.clippy]
new_without_default = "allow"
collapsible_match = "allow"

[profile.release]
debug = "line-tables-only"
overflow-checks = true
lto = "thin"

[profile.release.package.niri-config]
# knuffel with chomsky generates a metric ton of debuginfo.
debug = false

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
png.opt-level = 3

[package.metadata.generate-rpm]
name = "nori"
version = "26.04"
assets = [
    { source = "target/release/nori", dest = "/usr/bin/", mode = "755" },
    { source = "resources/nori-session", dest = "/usr/bin/", mode = "755" },
    { source = "resources/nori.desktop", dest = "/usr/share/wayland-sessions/", mode = "644" },
    { source = "resources/nori-portals.conf", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
    { source = "resources/nori.service", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "resources/nori-shutdown.target", dest = "/usr/lib/systemd/user/", mode = "644" },
]
[package.metadata.generate-rpm.requires]
alacritty = "*"
fuzzel = "*"

[package.metadata.deb]
name = "nori"
depends = "alacritty, fuzzel"
assets = [
    ["target/release/nori", "usr/bin/", "755"],
    ["resources/nori-session", "usr/bin/", "755"],
    ["resources/nori.desktop", "/usr/share/wayland-sessions/", "644"],
    ["resources/nori-portals.conf", "/usr/share/xdg-desktop-portal/", "644"],
    ["resources/nori.service", "/usr/lib/systemd/user/", "644"],
    ["resources/nori-shutdown.target", "/usr/lib/systemd/user/", "644"],
]
